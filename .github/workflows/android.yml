name: android

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        default: sideapk
        options: [sideapk, standard, ambos]
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "29.0.14206865"
  PROTOC_VERSION: "21.12"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Submodules the Android build needs
        run: |
          git submodule update --init --recursive \
            third-party/nanopb third-party/jerasure third-party/gf-complete \
            android/app/src/main/cpp/oboe

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK, NDK y CMake
        run: |
          # The runner already ships cmdline-tools; setup-android@v3 tries to
          # install the legacy "tools" package and now fails, so it is not used.
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No cmdline-tools on the runner, downloading"
            curl -sSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            python3 -c "import zipfile; zipfile.ZipFile('/tmp/cmdline.zip').extractall('$RUNNER_TEMP/sdk')"
            chmod -R +x "$RUNNER_TEMP/sdk/cmdline-tools/bin"
            SDKMANAGER="$RUNNER_TEMP/sdk/cmdline-tools/bin/sdkmanager"
            SDK="$RUNNER_TEMP/sdk"
          fi
          echo "SDK: $SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" \
                        "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null
          ls "$SDK/ndk"

      - name: protoc
        run: |
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/protoc.zip').extractall('$RUNNER_TEMP/protoc')"
          chmod +x "$RUNNER_TEMP/protoc/bin/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      # The OpenSSL external project inside .cxx is what makes a clean build
      # slow; with this the first run drops to ~1 min and the rest is Kotlin.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/app/.cxx
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'CMakeLists.txt', 'lib/**/*.c', 'lib/**/*.h') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Signing and local.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PW }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PW }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chiaki.jks"
            KEYSTORE="$RUNNER_TEMP/chiaki.jks"
          else
            echo "::warning::No keystore in the secrets: the APK is signed with Gradle's debug key and cannot update an existing install."
            KEYSTORE="$RUNNER_TEMP/keystore-ausente.jks"
          fi
          cat > android/local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          chiakiKeystore=$KEYSTORE
          chiakiKeystorePW=$KEYSTORE_PW
          chiakiKeyAlias=$KEY_ALIAS
          chiakiKeyPW=$KEY_PW
          EOF

      - name: Build patches (oboe, nanopb)
        run: bash scripts/prepare-build.sh

      - name: Unit tests
        working-directory: android
        run: ./gradlew testSideapkDebugUnitTest --no-daemon -Dorg.gradle.jvmargs="-Xmx3g"

      - name: Build
        working-directory: android
        run: |
          set -e
          case "${{ github.event.inputs.target || 'ambos' }}" in
            sideapk)  TASKS="assembleSideapkRelease" ;;
            standard) TASKS="assembleStandardRelease" ;;
            *)        TASKS="assembleSideapkRelease assembleStandardRelease" ;;
          esac
          echo "Tareas: $TASKS"
          # The tag carries the fork version (v1.0.0 -> 1.0.0). versionCode grows
          # with the run number so Android always accepts the update over the
          # previously installed build.
          FORK_VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) : ;; *) FORK_VERSION="1.0.0" ;; esac
          FORK_CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "Fork version: $FORK_VERSION (code $FORK_CODE)"
          ./gradlew $TASKS -Parm64only -PforkVersion="$FORK_VERSION" -PforkVersionCode="$FORK_CODE" \
            --no-daemon -Dorg.gradle.jvmargs="-Xmx3g"

      - name: Collect the APKs
        run: |
          set -e
          SHORT="${GITHUB_SHA::7}"
          mkdir -p dist
          for flavour in sideapk standard; do
            src="android/app/build/outputs/apk/$flavour/release/app-$flavour-release.apk"
            [ -f "$src" ] || continue
            out="dist/chiaki-up-plus-${flavour}-${SHORT}.apk"
            cp "$src" "$out"
            echo "--- $out"
            "${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt2" dump badging "$out" | grep -E "^package|application-label:" || true
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: chiaki-up-plus-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the release when tagged
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Chiaki-Up+ ${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$TITLE" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
